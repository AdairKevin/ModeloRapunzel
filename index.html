<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/extras.css" />
    <link rel="stylesheet" href="./styles/tema.css" />
  </head>

  <body class="center" data-tema="rapunzel" translate="no">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
      <div class="particulas" id="particulas" aria-hidden="true"></div>
      <!-- SOBRE DE BIENVENIDA -->
      <div class="envelope-screen" id="envelopeScreen">
        <div class="envelope">
          <div class="envelope-flap"></div>

          <!-- Flap inferior -->
          <div class="wax-seal" id="openEnvelope"></div>
        </div>
      </div>

      <div class="invitation-content hidden" id="invitationContent">
        <div class="content">
          <section class="section-home">
            <div class="home-content">
              <img class="home-img" alt="{{portada.fotoAlt}}" src="{{portada.foto}}" />
              <div class="titulo">
                <h1>{{portada.titulo}}</h1>
                <h2>{{portada.nombre}}</h2>
              </div>
            </div>
          </section>

          {{#musica}}
          <section class="musica">
            <div class="music-card">
              {{#musica.imagen}}<img class="rapunzel" src="{{musica.imagen}}" alt="" />{{/musica.imagen}}
              {{^musica.imagen}}<div class="album-art"></div>{{/musica.imagen}}
              <div class="song-title">{{musica.cancion}}</div>
              <div class="artist-name">{{musica.artista}}</div>

              <button class="play-button" id="playPauseBtn">▶</button>

              <div class="progress-container">
                <div class="progress" id="progressBar"></div>
              </div>

              <audio id="audioPlayer" src="{{musica.archivo}}"></audio>
            </div>
          </section>
          {{/musica}}

          {{#separadores.despuesMusica}}
          <div class="img-separador">
            <img src="{{.}}" alt="separador" />
          </div>
          {{/separadores.despuesMusica}}

          {{#dedicatoria}}
          <div class="palabras">
            <p>{{dedicatoria.texto}}</p>
            <small>{{dedicatoria.firma}}</small>
          </div>
          {{/dedicatoria}}

          {{#separadores.despuesDedicatoria}}
          <div class="img-separador">
            <img src="{{.}}" alt="separador" />
          </div>
          {{/separadores.despuesDedicatoria}}

          {{#invitacion}}
          <section class="section-info">
            <div class="overlay-section-info">
              <span></span>
              <span></span>
            </div>
            <div class="box-info">
              <div class="info-primary">
                {{#invitacion.encabezado}}
                <div class="sociedad">
                  <img style="width: {{invitacion.encabezado.anchoImagen}}" src="{{invitacion.encabezado.imagen}}" alt="" />
                  <h1>{{invitacion.encabezado.titulo}}</h1>
                  <h2 class="sub">{{invitacion.encabezado.subtitulo}}</h2>
                </div>
                {{/invitacion.encabezado}}

                <p>{{invitacion.saludo}}</p>
              </div>

              {{#invitacion.familiaArriba}}
              <div class="padrinos">
                <p>{{titulo}}</p>
                {{#nombres}}<h2>{{.}}</h2>{{/nombres}}
              </div>
              {{/invitacion.familiaArriba}}

              {{?invitacion.padres}}
              <div class="padres">
                <ul>
                  {{#invitacion.padres}}<li>{{.}}</li>{{/invitacion.padres}}
                </ul>
              </div>
              {{/invitacion.padres}}

              {{#invitacion.frase}}
              <div class="frase-p">
                <p>{{invitacion.frase}}</p>
              </div>
              {{/invitacion.frase}}

              <div class="frase-l">
                <h1>{{invitacion.fraseTitulo}}</h1>
                {{#invitacion.fraseTexto}}<p>{{invitacion.fraseTexto}}</p>{{/invitacion.fraseTexto}}
              </div>

              <div class="nombre">
                <h2>{{invitacion.nombre}}</h2>
                {{#invitacion.apellidos}}<h3>{{invitacion.apellidos}}</h3>{{/invitacion.apellidos}}
              </div>

              {{#invitacion.padrinos}}
              <div class="padrinos">
                <p>{{titulo}}</p>
                {{#nombres}}<h2>{{.}}</h2>{{/nombres}}
              </div>
              {{/invitacion.padrinos}}

              <div class="fecha">
                <p>{{invitacion.fechaTexto}}</p>
              </div>

              <div class="date-box">
                <h2 class="dia">{{invitacion.fecha.dia}}</h2>
                <h1>{{invitacion.fecha.fecha}}</h1>
                <h2 class="hora">{{invitacion.fecha.hora}}</h2>
              </div>
            </div>
          </section>
          {{/invitacion}}

          <!-- El calendario lo arma extras.js con evento.inicio -->
          {{#calendario}}<section class="section-calendario" id="calendario"></section>{{/calendario}}

          {{#cuentaRegresiva}}
          <div class="timer">
            <h1 class="timer-titulo">{{cuentaRegresiva.titulo}}</h1>
            <ul class="date-time">
              <li>
                <div class="time_number" id="dias"></div>
                <div class="time_txt">{{cuentaRegresiva.dias}}</div>
              </li>
              <li>
                <div class="time_number" id="horas"></div>
                <div class="time_txt">{{cuentaRegresiva.horas}}</div>
              </li>
              <li>
                <div class="time_number" id="minutos"></div>
                <div class="time_txt">{{cuentaRegresiva.minutos}}</div>
              </li>
              <li>
                <div class="time_number" id="segundos"></div>
                <div class="time_txt">{{cuentaRegresiva.segundos}}</div>
              </li>
            </ul>
          </div>
          {{/cuentaRegresiva}}

          {{#separadores.despuesCuentaRegresiva}}
          <div class="img-separador">
            <img src="{{.}}" alt="separador" />
          </div>
          {{/separadores.despuesCuentaRegresiva}}

          {{#ubicaciones.ceremonia}}
          <section class="section-place">
            <div class="box-place">
              <div class="place-info center">
                <img width="75" src="./assets/icons/church.svg" alt="church" fill="#000000" />
                <div class="place-txt">
                  <h2>{{ubicaciones.ceremonia.titulo}}</h2>
                  <p><b>{{ubicaciones.ceremonia.hora}}</b> {{ubicaciones.ceremonia.lugar}}</p>
                </div>
              </div>
              <a class="place-btn" href="{{ubicaciones.ceremonia.mapa}}" target="_blank">{{ubicaciones.ceremonia.boton}}</a>
            </div>
          </section>
          {{/ubicaciones.ceremonia}}

          {{#ubicaciones.recepcion}}
          <section class="section-place-salon">
            <div class="box-place-salon">
              <div class="place-info center">
                <img width="120" src="./assets/icons/bola.png" alt="disco" />
                <div class="place-txt fiesta">
                  <h2>{{ubicaciones.recepcion.titulo}}</h2>
                  <p><b>{{ubicaciones.recepcion.hora}}</b> {{ubicaciones.recepcion.lugar}}</p>
                </div>
              </div>
              <a class="place-btn" href="{{ubicaciones.recepcion.mapa}}" target="_blank">{{ubicaciones.recepcion.boton}}</a>
            </div>
          </section>
          {{/ubicaciones.recepcion}}

          {{#separadores.antesCronograma}}
          <div class="img-separador">
            <img src="{{.}}" alt="separador" />
          </div>
          {{/separadores.antesCronograma}}

          {{#cronograma}}
          <section class="section-cronograma">
            <h2>{{cronograma.titulo}}</h2>
            <ul class="cronograma">
              {{#cronograma.actividades}}
              <li><span class="hora">{{hora}}</span><span class="actividad">{{actividad}}</span></li>
              {{/cronograma.actividades}}
            </ul>
          </section>
          {{/cronograma}}

          {{#itinerario}}
          <section class="timeline">
            <h2>{{itinerario.titulo}}</h2>
            <img width="200" src="{{itinerario.imagen}}" alt="separator" class="timeline-separator" />
            <div class="timeline-container">
              {{#itinerario.actividades}}
              <div class="event {{@lado}}">
                <div class="sign">
                  <span class="time">{{hora}}</span>
                  <p>{{actividad}}</p>
                </div>
              </div>
              {{/itinerario.actividades}}
            </div>
          </section>
          {{/itinerario}}

          {{#instagram}}
          <section class="social-section">
            <div class="social-card">
              <span class="social-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></span>
              <h2>{{instagram.titulo}}</h2>
              <p>{{instagram.texto}}</p>
              <div class="instagram-user">{{instagram.usuario}}</div>
              {{#instagram.hashtag}}<p class="instagram-hashtag">{{instagram.hashtag}}</p>{{/instagram.hashtag}}
              <button class="confirmar">
                <a href="{{instagram.link}}" target="_blank">{{instagram.boton}}</a>
              </button>
            </div>
          </section>
          {{/instagram}}

          {{#separadores.despuesInstagram}}
          <div class="img-separador">
            <img src="{{.}}" alt="separador" />
          </div>
          {{/separadores.despuesInstagram}}

          <section class="section-galeria">
            <section class="section-info-adicional">
              {{#vestimenta}}
              <div class="info-block info-clothes">
                <img height="70" src="./assets/icons/Clothes.svg" alt="clothes" />
                <h2>{{vestimenta.titulo}}</h2>
                <p>{{vestimenta.texto}}</p>
              </div>
              {{/vestimenta}}

              {{#vestimenta}}
              <div class="info-separator">
                <img width="200" src="./assets/img/separador.png" alt="separator" />
              </div>
              {{/vestimenta}}

              {{#regalos}}
              <div class="info-block info-envelope">
                <img width="70" src="./assets/icons/envelope.svg" alt="envelope" />
                <h2>{{regalos.titulo}}</h2>
                <p>{{regalos.texto}}</p>
                {{#regalos.boton}}
                <button class="confirmar">
                  <a href="{{regalos.link}}" target="_blank">{{regalos.boton}}</a>
                </button>
                {{/regalos.boton}}
              </div>
              {{/regalos}}
            </section>
          </section>

          {{#confirmacion}}
          <section class="section-message">
            <div class="box-message">
              <p>{{confirmacion.frase}}</p>
              <b>{{confirmacion.destacado}}</b>
              <form class="rsvp-form" id="rsvpForm">
                <h3>{{confirmacion.titulo}}</h3>
                <label for="rsvpNombre">{{confirmacion.campoNombre}}</label>
                <input id="rsvpNombre" name="nombre" type="text" required />
                <div class="rsvp-opciones">
                  <label><input type="radio" name="asistencia" value="si" checked /><span>{{confirmacion.opcionSi}}</span></label>
                  <label><input type="radio" name="asistencia" value="no" /><span>{{confirmacion.opcionNo}}</span></label>
                </div>
                <div class="campo-personas">
                  <label for="rsvpPersonas">{{confirmacion.campoAsistentes}}</label>
                  <input id="rsvpPersonas" name="personas" type="number" min="1" value="1" />
                </div>
                <label for="rsvpMensaje">{{confirmacion.campoMensaje}}</label>
                <textarea id="rsvpMensaje" name="mensaje" rows="3"></textarea>
                <button type="submit" class="btn-tema">{{confirmacion.boton}}</button>
              </form>
              <p class="rsvp-gracias">{{confirmacion.gracias}}</p>
            </div>
          </section>
          {{/confirmacion}}

          <!-- Footer (con "promo" usa la versión con botón) -->
          {{#footer.promo}}
          <footer class="footer-mirai">
            <span>{{footer.texto}} <b>{{footer.marca}}</b>.</span>
            <p>{{footer.promo}}</p>
            <a class="footer-mirai-link" href="{{footer.link}}" target="_blank">{{footer.boton}}</a>
          </footer>
          {{/footer.promo}}
          {{^footer.promo}}
          <footer>
            {{footer.texto}}
            <a href="{{footer.link}}" target="_blank">{{footer.marca}}</a>
            {{footer.anio}}
          </footer>
          {{/footer.promo}}
        </div>
      </div>
      <script src="script.js"></script>
      <script src="extras.js"></script>
    </template>

    <script src="motor.js"></script>
  </body>
</html>
